<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shadow Fight Online PvP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { margin:0; height:100%; background:#050b07; color:#fff; font-family:'Segoe UI',Tahoma,sans-serif; overflow:hidden; }
  #stage { position:relative; width:min(100vw,calc(100vh*16/9)); aspect-ratio:16/9; background:#000; overflow:hidden; }
  .avatar-frame { border:3px solid #d4af37; box-shadow:0 0 15px rgba(212,175,55,.4); }
  .hp-fill { transition:width .1s ease-out; }
  .joy-base { background:radial-gradient(circle,rgba(40,60,45,.7),rgba(10,20,15,.85)); border:3px solid rgba(180,220,190,.4); touch-action:none; }
  .joy-thumb { background:radial-gradient(circle,#e67e22,#a04000); border:2px solid #f39c12; }
  .btn-action { background:radial-gradient(circle,rgba(50,60,70,.8),rgba(20,25,30,.9)); border:2px solid rgba(255,255,255,.3); touch-action:none; }
  .btn-action:active { transform:scale(.92); border-color:#e67e22; }
  .glass { background:rgba(15,25,20,.88); backdrop-filter:blur(10px); }
</style>
</head>
<body class="flex items-center justify-center">
<div id="stage">
  <canvas id="cv" width="1000" height="562" class="w-full h-full block"></canvas>

  <!-- HUD -->
  <div id="hud" class="absolute top-0 left-0 right-0 p-2 flex justify-between items-start pointer-events-none hidden">
    <div class="flex items-center gap-2 w-[42%]">
      <div class="w-11 h-11 rounded-full bg-neutral-800 avatar-frame flex items-center justify-center text-xl shrink-0">🥷</div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between text-[11px] font-bold text-amber-300"><span id="n1" class="truncate">P1</span><span id="h1">100</span></div>
        <div class="h-3 bg-red-950 rounded border border-amber-900 overflow-hidden"><div id="b1" class="h-full bg-gradient-to-r from-red-600 via-amber-500 to-green-500 hp-fill" style="width:100%"></div></div>
      </div>
    </div>
    <div class="flex flex-col items-center w-[12%]">
      <div id="timer" class="w-10 h-10 rounded-full bg-stone-900 border-2 border-amber-500 flex items-center justify-center text-amber-400 font-extrabold">99</div>
      <span id="roomTag" class="text-[10px] text-amber-300 font-mono mt-1 bg-stone-900/80 px-2 rounded">-</span>
    </div>
    <div class="flex items-center gap-2 w-[42%] flex-row-reverse">
      <div class="w-11 h-11 rounded-full bg-neutral-800 avatar-frame flex items-center justify-center text-xl shrink-0">⚔️</div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between flex-row-reverse text-[11px] font-bold text-amber-300"><span id="n2" class="truncate">P2</span><span id="h2">100</span></div>
        <div class="h-3 bg-red-950 rounded border border-amber-900 overflow-hidden flex justify-end"><div id="b2" class="h-full bg-gradient-to-l from-red-600 via-amber-500 to-green-500 hp-fill" style="width:100%"></div></div>
      </div>
    </div>
  </div>

  <!-- TOUCH -->
  <div id="touch" class="absolute bottom-3 left-0 right-0 px-5 flex justify-between items-end hidden pointer-events-none">
    <div id="joy" class="w-32 h-32 rounded-full joy-base relative flex items-center justify-center pointer-events-auto">
      <div id="thumb" class="w-12 h-12 rounded-full joy-thumb absolute pointer-events-none"></div>
    </div>
    <div class="relative w-40 h-36 pointer-events-auto">
      <button id="bPunch" class="absolute bottom-1 right-1 w-16 h-16 rounded-full btn-action text-2xl">👊</button>
      <button id="bKick" class="absolute bottom-1 right-[4.8rem] w-14 h-14 rounded-full btn-action text-xl">🦶</button>
      <button id="bWeapon" class="absolute bottom-[4.8rem] right-1 w-14 h-14 rounded-full btn-action text-xl">⚔️</button>
    </div>
  </div>

  <!-- MENU -->
  <div id="menu" class="absolute inset-0 glass flex flex-col items-center justify-center p-4 z-20 overflow-y-auto">
    <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600 mb-1">SHADOW FIGHT 2D</h1>
    <p class="text-amber-200/70 text-xs mb-4">Võ thuật bóng đêm PvP Online</p>

    <div id="nameBox" class="w-full max-w-sm bg-stone-900/90 border border-amber-500/40 p-4 rounded-xl space-y-3">
      <h2 class="text-center font-bold text-amber-400 text-sm">NHẬP TÊN NGƯỜI CHƠI</h2>
      <input id="inName" maxlength="12" placeholder="Tên của bạn..." class="w-full bg-stone-950 border border-amber-900 focus:border-amber-500 text-amber-100 text-sm rounded px-3 py-2 outline-none text-center font-bold">
      <button id="btnEnter" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-black py-2 rounded text-sm">VÀO MENU ➔</button>
    </div>

    <div id="modeBox" class="w-full max-w-sm space-y-2 hidden">
      <div class="flex justify-between items-center bg-stone-900/80 px-3 py-1.5 rounded-lg border border-amber-500/30 text-xs">
        <span class="text-stone-400">Đấu sĩ: <b id="dispName" class="text-amber-400 text-sm"></b></span>
        <button id="btnRename" class="text-amber-300 underline">Đổi tên</button>
      </div>
      <div class="flex gap-2">
        <button id="btnAI" class="flex-1 py-2.5 bg-stone-800 hover:bg-stone-700 border border-stone-500 rounded-lg font-bold text-amber-200 text-xs">🤖 Đấu máy</button>
        <button id="btn2P" class="flex-1 py-2.5 bg-stone-800 hover:bg-stone-700 border border-stone-500 rounded-lg font-bold text-amber-200 text-xs">👥 2 người 1 máy</button>
      </div>
      <div class="text-center text-[10px] text-amber-500 uppercase tracking-widest">Online PvP</div>
      <div class="flex gap-2">
        <button id="btnCreate" class="flex-1 py-2.5 bg-gradient-to-r from-amber-600 to-amber-700 text-stone-950 font-black rounded-lg text-xs">➕ Tạo phòng</button>
        <div class="flex-1 flex gap-1">
          <input id="inRoom" maxlength="4" inputmode="numeric" placeholder="Mã" class="w-14 bg-stone-950 border border-amber-800 rounded text-center text-amber-300 font-mono font-bold text-sm outline-none">
          <button id="btnJoin" class="flex-1 py-2.5 bg-stone-800 border border-amber-500/50 text-amber-400 font-bold rounded-lg text-xs">Vào phòng</button>
        </div>
      </div>
      <p class="text-[10px] text-stone-400 text-center leading-relaxed">Phím: <b>A/D</b> di chuyển · <b>W</b> nhảy · <b>S</b> cúi (né đòn cao) · <b>J</b> đấm · <b>K</b> đá · <b>U</b> kiếm.<br>P2 (2 người 1 máy): mũi tên + 1/2/3</p>
    </div>
  </div>

  <!-- WAITING -->
  <div id="wait" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center z-30 hidden">
    <p id="waitMsg" class="text-sm text-stone-300 mb-1">Đang chờ đối thủ...</p>
    <div id="waitCode" class="text-6xl font-black text-amber-400 tracking-[.3em] mb-2">0000</div>
    <p class="text-xs text-stone-400 mb-4">Gửi mã này cho bạn bè để vào phòng</p>
    <button id="btnCancel" class="px-5 py-2 bg-stone-700 hover:bg-stone-600 rounded-lg text-sm font-bold">Huỷ</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-30 hidden">
    <h2 id="resTitle" class="text-3xl font-black text-amber-400 mb-1 text-center px-4"></h2>
    <p id="resDesc" class="text-sm text-stone-300 mb-5 text-center px-4"></p>
    <div class="flex gap-2">
      <button id="btnRematch" class="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold rounded-lg text-sm">Chơi lại</button>
      <button id="btnMenu" class="px-5 py-2 bg-stone-700 hover:bg-stone-600 font-bold rounded-lg text-sm">Về menu</button>
    </div>
  </div>

  <div id="toast" class="absolute top-16 left-1/2 -translate-x-1/2 bg-stone-900/95 border border-amber-500/50 text-amber-200 text-xs px-4 py-2 rounded-lg z-40 hidden"></div>
</div>

<script>
// ================= CONFIG =================
const SUPABASE_URL = "https://boyucafuxksicwwzdpxl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ec7Nh_W8CpUM-uEVNg5_IA_4o4zihm0";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const W = 1000, H = 562, GROUND = 460, DT = 1000 / 60;

// ================= STATE =================
let mode = 'MENU';           // MENU | AI | LOCAL2P | HOST | GUEST
let running = false, over = false;
let timer = 99, ticks = 0;
let channel = null, roomCode = null, myId = Math.random().toString(36).slice(2, 9);
let guestId = null, guestJoined = false, joinTimer = null;
let playerName = 'Player', oppName = 'Đối thủ';
let remote = { l:0, r:0, u:0, d:0, atk:null };
let lastSent = '';

const ATK = {
  punch:  { t:18, w:50, h:25, oy:85, dmg:8 },
  kick:   { t:22, w:60, h:30, oy:55, dmg:12 },
  weapon: { t:28, w:80, h:40, oy:95, dmg:18 }
};

// ================= FIGHTER =================
class Fighter {
  constructor(isP1) { this.isP1 = isP1; this.reset(); }
  reset() {
    this.x = this.isP1 ? 250 : 750; this.y = GROUND; this.vx = 0; this.vy = 0;
    this.hp = 100; this.state = 'idle'; this.timer = 0; this.dur = 0;
    this.hasHit = false; this.invuln = 0; this.flash = 0;
    this.facing = this.isP1 ? 1 : -1; this.grounded = true;
    this.tx = this.x; this.ty = this.y;
  }
  get attacking() { return this.state in ATK; }
  hurtbox() { const h = this.state === 'crouch' ? 55 : 100; return { x:this.x - 20, y:this.y - h, w:40, h }; }
  attack(type) {
    if (this.attacking || this.state === 'hit' || !ATK[type]) return;
    this.state = type; this.dur = this.timer = ATK[type].t; this.hasHit = false;
  }
  hit(dmg, dir) {
    this.hp = Math.max(0, this.hp - dmg);
    this.state = 'hit'; this.timer = 14; this.invuln = 26; this.flash = 8;
    this.vx = dir * 5;
  }
  step(inp, enemy) {
    if (this.invuln > 0) this.invuln--;
    if (this.flash > 0) this.flash--;
    if (this.timer > 0 && --this.timer === 0) this.state = 'idle';

    if (this.state === 'hit') this.vx *= 0.85;
    else if (this.attacking) this.vx *= 0.8;
    else {
      const crouch = inp.d && this.grounded;
      this.vx = crouch ? 0 : ((inp.r ? 1 : 0) - (inp.l ? 1 : 0)) * 5.5;
      if (inp.u && this.grounded) this.vy = -14;
      this.state = crouch ? 'crouch' : 'idle';
      if (inp.atk) this.attack(inp.atk);
      this.facing = this.x <= enemy.x ? 1 : -1;
    }

    this.vy += 0.65; this.x += this.vx; this.y += this.vy;
    if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; this.grounded = true; } else this.grounded = false;
    this.x = Math.max(30, Math.min(W - 30, this.x));

    // hit detection (4 frame startup)
    if (this.attacking && !this.hasHit && this.dur - this.timer >= 4 && enemy.invuln === 0) {
      const a = ATK[this.state];
      const box = { x: this.facing === 1 ? this.x + 10 : this.x - 10 - a.w, y: this.y - a.oy, w: a.w, h: a.h };
      const e = enemy.hurtbox();
      if (box.x < e.x + e.w && box.x + box.w > e.x && box.y < e.y + e.h && box.y + box.h > e.y) {
        enemy.hit(a.dmg, this.facing); this.hasHit = true;
      }
    }
  }
  draw() {
    const c = ctx, crouch = this.state === 'crouch';
    const body = this.flash % 2 === 1 ? '#fff' : (this.isP1 ? '#1d1d1d' : '#18223f');
    const accent = this.isP1 ? '#d4af37' : '#3b82f6';
    c.save(); c.translate(this.x, this.y);
    c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(0, 0, 30, 8, 0, 0, 7); c.fill();
    c.scale(this.facing, 1);
    c.shadowColor = accent; c.shadowBlur = 8;
    c.fillStyle = body; c.strokeStyle = body; c.lineCap = 'round';
    c.beginPath(); crouch ? c.ellipse(0, -35, 18, 25, 0, 0, 7) : c.ellipse(0, -65, 16, 32, 0, 0, 7); c.fill();
    const hy = crouch ? -65 : -105;
    c.beginPath(); c.arc(0, hy, 13, 0, 7); c.fill();
    c.shadowBlur = 0; c.fillStyle = accent; c.fillRect(-9, hy - 6, 18, 4);
    c.lineWidth = 8; c.beginPath();
    if (crouch) { c.moveTo(-5,-30); c.lineTo(-20,-10); c.lineTo(-22,0); c.moveTo(5,-30); c.lineTo(20,-10); c.lineTo(22,0); }
    else if (!this.grounded) { c.moveTo(-5,-45); c.lineTo(-18,-25); c.moveTo(5,-45); c.lineTo(12,-15); }
    else { c.moveTo(-5,-40); c.lineTo(-12,0); c.moveTo(5,-40); c.lineTo(15,0); }
    c.stroke();
    c.beginPath();
    if (this.state === 'punch') { c.moveTo(-5,-75); c.lineTo(38,-75); }
    else if (this.state === 'kick') { c.moveTo(0,-40); c.lineTo(45,-45); }
    else if (this.state === 'weapon') {
      c.moveTo(-5,-70); c.lineTo(28,-92); c.stroke();
      c.strokeStyle = '#60a5fa'; c.lineWidth = 4; c.beginPath(); c.arc(10,-70,55,-0.8,0.8);
    }
    else if (this.state === 'hit') { c.moveTo(-5,-70); c.lineTo(-18,-60); c.moveTo(5,-70); c.lineTo(-10,-55); }
    else { c.moveTo(-5,-70); c.lineTo(12,-80); c.moveTo(5,-70); c.lineTo(18,-65); }
    c.stroke(); c.restore();
  }
}
const p1 = new Fighter(true), p2 = new Fighter(false);

// ================= INPUT =================
const keys = {}, touch = { l:0, r:0, u:0, d:0 }, atkQ = { p1:null, p2:null };
const K = k => !!keys[k];

function p1Input() {
  const two = mode === 'LOCAL2P';
  const inp = {
    l: K('a') || (!two && K('arrowleft')) || touch.l,
    r: K('d') || (!two && K('arrowright')) || touch.r,
    u: K('w') || (!two && K('arrowup')) || touch.u,
    d: K('s') || (!two && K('arrowdown')) || touch.d,
    atk: atkQ.p1
  };
  atkQ.p1 = null; return inp;
}
function p2LocalInput() {
  const inp = { l:K('arrowleft'), r:K('arrowright'), u:K('arrowup'), d:K('arrowdown'), atk:atkQ.p2 };
  atkQ.p2 = null; return inp;
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  if (e.repeat) return;
  keys[k] = true;
  const two = mode === 'LOCAL2P';
  if (k === 'j' || (!two && k === '1')) atkQ.p1 = 'punch';
  if (k === 'k' || (!two && k === '2')) atkQ.p1 = 'kick';
  if (k === 'u' || (!two && k === '3')) atkQ.p1 = 'weapon';
  if (two) { if (k === '1') atkQ.p2 = 'punch'; if (k === '2') atkQ.p2 = 'kick'; if (k === '3') atkQ.p2 = 'weapon'; }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// Joystick (pointer events)
const joy = $('joy'), thumb = $('thumb');
let joyPtr = null;
function joyMove(e) {
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = r.width * 0.33, d = Math.hypot(dx, dy);
  if (d > m) { dx = dx / d * m; dy = dy / d * m; }
  thumb.style.transform = `translate(${dx}px,${dy}px)`;
  touch.l = dx < -12 ? 1 : 0; touch.r = dx > 12 ? 1 : 0;
  touch.u = dy < -22 ? 1 : 0; touch.d = dy > 22 ? 1 : 0;
}
function joyEnd() { joyPtr = null; thumb.style.transform = ''; touch.l = touch.r = touch.u = touch.d = 0; }
joy.addEventListener('pointerdown', e => { e.preventDefault(); joyPtr = e.pointerId; joy.setPointerCapture(e.pointerId); joyMove(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyPtr) joyMove(e); });
joy.addEventListener('pointerup', e => { if (e.pointerId === joyPtr) joyEnd(); });
joy.addEventListener('pointercancel', joyEnd);
[['bPunch','punch'],['bKick','kick'],['bWeapon','weapon']].forEach(([id, t]) =>
  $(id).addEventListener('pointerdown', e => { e.preventDefault(); atkQ.p1 = t; }));

// ================= GAME FLOW =================
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2500);
}
function show(id, v) { $(id).classList.toggle('hidden', !v); }

function startGame() {
  p1.reset(); p2.reset(); timer = 99; ticks = 0; over = false; running = true;
  remote = { l:0, r:0, u:0, d:0, atk:null }; atkQ.p1 = atkQ.p2 = null;
  const mine = playerName.toUpperCase(), opp = oppName.toUpperCase();
  $('n1').textContent = (mode === 'GUEST' ? opp : mine) + ' (P1)';
  $('n2').textContent = (mode === 'GUEST' ? mine : mode === 'AI' ? 'MÁY' : mode === 'LOCAL2P' ? 'NGƯỜI CHƠI 2' : opp) + ' (P2)';
  $('roomTag').textContent = roomCode ? 'Phòng ' + roomCode : mode === 'AI' ? 'Đấu máy' : '2 người';
  $('timer').textContent = timer;
  show('menu', false); show('wait', false); show('result', false);
  show('hud', true); show('touch', true);
  $('btnRematch').classList.toggle('hidden', mode === 'GUEST');
}

function endGame(fromRemote) {
  if (over) return;
  over = true; running = false;
  let title = 'HOÀ NHAU!', desc = 'Hai cao thủ đồng sức đồng tài.';
  const n1 = mode === 'GUEST' ? oppName : playerName;
  const n2 = mode === 'AI' ? 'Máy' : mode === 'LOCAL2P' ? 'Người chơi 2' : mode === 'GUEST' ? playerName : oppName;
  if (p1.hp > p2.hp) { title = n1.toUpperCase() + ' THẮNG!'; desc = 'Đối thủ đã gục ngã.'; }
  else if (p2.hp > p1.hp) { title = n2.toUpperCase() + ' THẮNG!'; desc = 'Tuyệt kỹ bóng đêm làm chủ trận đấu.'; }
  $('resTitle').textContent = title; $('resDesc').textContent = desc;
  show('result', true);
  if (mode === 'GUEST') $('btnRematch').classList.add('hidden');
}

function cleanup() {
  running = false; over = false; clearInterval(joinTimer); joinTimer = null;
  if (channel) { try { channel.send({ type:'broadcast', event:'leave', payload:{ id:myId } }); } catch (e) {} sb.removeChannel(channel); channel = null; }
  roomCode = null; guestId = null; guestJoined = false; mode = 'MENU'; lastSent = '';
}
function toMenu() {
  cleanup();
  ['hud','touch','wait','result'].forEach(i => show(i, false));
  show('menu', true); show('nameBox', false); show('modeBox', true);
}

// ================= AI =================
function aiInput() {
  const inp = { l:0, r:0, u:0, d:0, atk:null };
  const dx = p1.x - p2.x, dist = Math.abs(dx);
  if (p2.attacking || p2.state === 'hit') return inp;
  if (dist > 95) { if (dx < 0) inp.l = 1; else inp.r = 1; }
  else if (dist < 55 && Math.random() < 0.05) { if (dx < 0) inp.r = 1; else inp.l = 1; }
  else if (Math.random() < 0.05) inp.atk = ['punch','kick','weapon'][Math.random() * 3 | 0];
  if (Math.random() < 0.004) inp.u = 1;
  if (p1.attacking && dist < 110 && Math.random() < 0.08) inp.d = 1;
  return inp;
}

// ================= SIM LOOP =================
function simulate() {
  if (mode === 'GUEST') {
    for (const p of [p1, p2]) { p.x += (p.tx - p.x) * 0.4; p.y += (p.ty - p.y) * 0.4; }
    sendGuestInput();
    return;
  }
  const i1 = p1Input();
  const i2 = mode === 'AI' ? aiInput() : mode === 'LOCAL2P' ? p2LocalInput() : remote;
  p1.step(i1, p2); p2.step(i2, p1);
  if (mode === 'HOST') remote.atk = null;

  if (++ticks % 60 === 0 && timer > 0) timer--;
  if (p1.hp <= 0 || p2.hp <= 0 || timer <= 0) endGame();
  if (mode === 'HOST' && ticks % 3 === 0) broadcastState();
}

function broadcastState() {
  if (!channel) return;
  const f = p => [Math.round(p.x), Math.round(p.y), p.hp, p.state, p.facing, p.flash, p.grounded ? 1 : 0];
  channel.send({ type:'broadcast', event:'state', payload:{ a:f(p1), b:f(p2), t:timer, o:over ? 1 : 0 } });
}
function applyState(s) {
  [[p1, s.a], [p2, s.b]].forEach(([p, a]) => {
    p.tx = a[0]; p.ty = a[1]; p.hp = a[2]; p.state = a[3]; p.facing = a[4]; p.flash = a[5]; p.grounded = !!a[6];
  });
  timer = s.t;
  if (s.o) { p1.x = p1.tx; p2.x = p2.tx; endGame(true); }
}
function sendGuestInput() {
  if (!channel) return;
  const inp = p1Input();
  const msg = { l:+!!inp.l, r:+!!inp.r, u:+!!inp.u, d:+!!inp.d, atk:inp.atk };
  const sig = JSON.stringify([msg.l, msg.r, msg.u, msg.d]);
  if (inp.atk || sig !== lastSent || ticks++ % 6 === 0) {
    lastSent = sig;
    channel.send({ type:'broadcast', event:'input', payload:{ id:myId, ...msg } });
  }
}

// ================= REALTIME =================
function openChannel(code) {
  roomCode = code;
  channel = sb.channel('sf_room_' + code, { config:{ broadcast:{ self:false, ack:false } } });

  channel.on('broadcast', { event:'join' }, ({ payload }) => {
    if (mode !== 'HOST') return;
    if (!guestId || guestId === payload.id) {
      guestId = payload.id; oppName = payload.name || 'Đối thủ';
      channel.send({ type:'broadcast', event:'start', payload:{ to:guestId, name:playerName } });
      if (!guestJoined) { guestJoined = true; startGame(); }
    } else {
      channel.send({ type:'broadcast', event:'full', payload:{ to:payload.id } });
    }
  });
  channel.on('broadcast', { event:'start' }, ({ payload }) => {
    if (mode !== 'GUEST' || payload.to !== myId) return;
    clearInterval(joinTimer); joinTimer = null;
    oppName = payload.name || 'Chủ phòng';
    if (!running || over) startGame();
  });
  channel.on('broadcast', { event:'full' }, ({ payload }) => {
    if (mode === 'GUEST' && payload.to === myId) { toast('Phòng đã đủ người!'); toMenu(); }
  });
  channel.on('broadcast', { event:'input' }, ({ payload }) => {
    if (mode !== 'HOST' || payload.id !== guestId) return;
    remote.l = payload.l; remote.r = payload.r; remote.u = payload.u; remote.d = payload.d;
    if (payload.atk) remote.atk = payload.atk;
  });
  channel.on('broadcast', { event:'state' }, ({ payload }) => { if (mode === 'GUEST' && running) applyState(payload); });
  channel.on('broadcast', { event:'leave' }, ({ payload }) => {
    if (payload.id === myId) return;
    if (mode === 'HOST' && guestJoined) {
      guestJoined = false; guestId = null; running = false; over = true;
      $('resTitle').textContent = 'ĐỐI THỦ ĐÃ THOÁT'; $('resDesc').textContent = 'Bạn có thể quay lại menu và tạo phòng mới.';
      $('btnRematch').classList.add('hidden'); show('result', true);
    } else if (mode === 'GUEST') {
      running = false; over = true;
      $('resTitle').textContent = 'CHỦ PHÒNG ĐÃ THOÁT'; $('resDesc').textContent = 'Trận đấu kết thúc.';
      show('result', true);
    }
  });
  return channel;
}

function createRoom() {
  const code = String(1000 + Math.random() * 9000 | 0);
  mode = 'HOST'; guestId = null; guestJoined = false;
  openChannel(code).subscribe(status => {
    if (status === 'SUBSCRIBED') {
      $('waitCode').textContent = code; $('waitMsg').textContent = 'Đang chờ đối thủ...';
      show('menu', false); show('wait', true);
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { toast('Không kết nối được Supabase'); toMenu(); }
  });
}
function joinRoom(code) {
  mode = 'GUEST';
  openChannel(code).subscribe(status => {
    if (status === 'SUBSCRIBED') {
      $('waitCode').textContent = code; $('waitMsg').textContent = 'Đang vào phòng...';
      show('menu', false); show('wait', true);
      let tries = 0;
      const send = () => {
        if (++tries > 6) { toast('Không tìm thấy phòng ' + code); toMenu(); return; }
        channel.send({ type:'broadcast', event:'join', payload:{ id:myId, name:playerName } });
      };
      send(); joinTimer = setInterval(send, 1000);
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { toast('Không kết nối được Supabase'); toMenu(); }
  });
}

// ================= RENDER =================
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a150d'); g.addColorStop(.6, '#132e1b'); g.addColorStop(1, '#1c3d25');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,250,220,.85)'; ctx.beginPath(); ctx.arc(500, 140, 70, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,250,220,.08)'; ctx.beginPath(); ctx.arc(500, 140, 120, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(10,25,15,.6)';
  for (let i = 0; i < W; i += 35) ctx.fillRect(i, 80, 8, H - 80);
  ctx.fillStyle = '#061209';
  for (let i = 15; i < W; i += 70) { ctx.fillRect(i, 0, 14, GROUND); for (let j = 40; j < GROUND; j += 60) ctx.fillRect(i - 2, j, 18, 3); }
  ctx.fillStyle = '#050a06'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#0f2614'; ctx.fillRect(0, GROUND, W, 4);
}
function render() {
  drawBg(); p1.draw(); p2.draw();
  $('b1').style.width = p1.hp + '%'; $('b2').style.width = p2.hp + '%';
  $('h1').textContent = Math.ceil(p1.hp); $('h2').textContent = Math.ceil(p2.hp);
  $('timer').textContent = timer;
}
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 100); last = now;
  while (acc >= DT) { if (running && !over) simulate(); acc -= DT; }
  render(); requestAnimationFrame(frame);
}

// ================= UI =================
const saved = localStorage.getItem('shadow_nickname');
if (saved) $('inName').value = saved;
$('btnEnter').onclick = () => {
  const n = $('inName').value.trim();
  if (!n) return toast('Vui lòng nhập tên!');
  playerName = n; localStorage.setItem('shadow_nickname', n);
  $('dispName').textContent = n; show('nameBox', false); show('modeBox', true);
};
$('inName').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnEnter').click(); });
$('btnRename').onclick = () => { show('modeBox', false); show('nameBox', true); };
$('btnAI').onclick = () => { mode = 'AI'; roomCode = null; oppName = 'Máy'; startGame(); };
$('btn2P').onclick = () => { mode = 'LOCAL2P'; roomCode = null; oppName = 'Người chơi 2'; startGame(); };
$('btnCreate').onclick = createRoom;
$('btnJoin').onclick = () => {
  const c = $('inRoom').value.trim();
  if (!/^\d{4}$/.test(c)) return toast('Nhập mã phòng 4 số!');
  joinRoom(c);
};
$('btnCancel').onclick = toMenu;
$('btnMenu').onclick = toMenu;
$('btnRematch').onclick = () => {
  if (mode === 'HOST') {
    if (!guestJoined) return;
    startGame(); channel.send({ type:'broadcast', event:'start', payload:{ to:guestId, name:playerName } });
  } else startGame();
};

requestAnimationFrame(frame);
</script>
